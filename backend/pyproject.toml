[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-core-starter"
version = "0.1.0"
description = "Local-first AgentOS prototype API and agent runtime"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentos*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
